<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <!-- Background Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#1E40AF" flood-opacity="0.3"/>
    </filter>
    <filter id="docShadow" x="-15%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0F172A" flood-opacity="0.18"/>
    </filter>
    
    <!-- Gradients -->
    <linearGradient id="docGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F1F5F9"/>
    </linearGradient>
    <linearGradient id="foldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>
    <linearGradient id="sealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
  </defs>

  <!-- Ambient Decorative Rings -->
  <circle cx="100" cy="100" r="76" fill="#3B82F6" opacity="0.15" />
  <circle cx="100" cy="100" r="62" fill="#60A5FA" opacity="0.12" />

  <!-- Floating Background Card (Back tilt) -->
  <rect x="42" y="32" width="102" height="136" rx="14" fill="#93C5FD" opacity="0.35" transform="rotate(-7 93 100)" />

  <!-- Main Document (Front) -->
  <g filter="url(#docShadow)">
    <path d="M52 28 C52 22 56 18 62 18 L122 18 L152 48 L152 162 C152 168 148 172 142 172 L62 172 C56 172 52 168 52 162 Z" fill="url(#docGrad)"/>
    
    <!-- Folded Corner -->
    <path d="M122 18 L122 44 C122 46.2 123.8 48 126 48 L152 48 Z" fill="url(#foldGrad)"/>

    <!-- Document Header / Official Crest Bar -->
    <rect x="66" y="36" width="46" height="6" rx="3" fill="#2563EB"/>

    <!-- Document Content Lines -->
    <rect x="66" y="52" width="70" height="4.5" rx="2.25" fill="#94A3B8"/>
    <rect x="66" y="63" width="60" height="4.5" rx="2.25" fill="#CBD5E1"/>
    <rect x="66" y="74" width="65" height="4.5" rx="2.25" fill="#CBD5E1"/>
    <rect x="66" y="85" width="48" height="4.5" rx="2.25" fill="#E2E8F0"/>

    <!-- Separator Line -->
    <line x1="66" y1="99" x2="136" y2="99" stroke="#E2E8F0" stroke-width="1.5" stroke-dasharray="3 2"/>

    <!-- Verification Section -->
    <rect x="66" y="108" width="52" height="4.5" rx="2.25" fill="#94A3B8"/>
    <rect x="66" y="119" width="42" height="4.5" rx="2.25" fill="#CBD5E1"/>
  </g>

  <!-- Official Wax / Verified Stamp Badge -->
  <g filter="url(#glow)">
    <circle cx="132" cy="138" r="24" fill="url(#sealGrad)"/>
    <circle cx="132" cy="138" r="20" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-dasharray="3 2" opacity="0.8"/>
    
    <!-- Shield / Checkmark Inside Badge -->
    <path d="M125 138 L130 143 L140 133" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Ribbon tails -->
    <path d="M124 158 L121 176 L130 171 L139 176 L136 158 Z" fill="#1D4ED8" opacity="0.9"/>
  </g>

  <!-- Floating Sparkles -->
  <g fill="url(#goldGrad)">
    <polygon points="44,52 46,58 52,60 46,62 44,68 42,62 36,60 42,58" opacity="0.9"/>
    <polygon points="160,88 161.5,93 166.5,94.5 161.5,96 160,101 158.5,96 153.5,94.5 158.5,93" opacity="0.8"/>
    <circle cx="146" cy="22" r="3" fill="#FBBF24" opacity="0.8"/>
  </g>
</svg>
