<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" fill="none">
  <!-- Glowing background aura -->
  <defs>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <linearGradient id="docGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#eff6ff" />
    </linearGradient>
    <linearGradient id="foldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#bfdbfe" />
      <stop offset="100%" stop-color="#93c5fd" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.18" />
    </filter>
  </defs>

  <!-- Ambient light orb behind document -->
  <circle cx="120" cy="115" r="75" fill="#ffffff" fill-opacity="0.18" filter="url(#softGlow)" />

  <!-- Back tilted paper sheet -->
  <g transform="rotate(7 120 120)">
    <rect x="58" y="38" width="112" height="150" rx="14" fill="#dbeafe" fill-opacity="0.85" filter="url(#dropShadow)" />
  </g>

  <!-- Primary Foreground Document -->
  <g transform="rotate(-4 116 118)">
    <rect x="52" y="32" width="120" height="160" rx="16" fill="url(#docGrad)" filter="url(#dropShadow)" />
    
    <!-- Top corner folded triangle -->
    <path d="M142 32 L172 62 L142 62 Z" fill="url(#foldGrad)" />
    
    <!-- Header banner in document -->
    <rect x="68" y="52" width="60" height="10" rx="5" fill="#3b82f6" />
    
    <!-- Content lines simulating official notice -->
    <rect x="68" y="74" width="88" height="6" rx="3" fill="#cbd5e1" />
    <rect x="68" y="88" width="80" height="6" rx="3" fill="#cbd5e1" />
    <rect x="68" y="102" width="88" height="6" rx="3" fill="#e2e8f0" />
    <rect x="68" y="116" width="64" height="6" rx="3" fill="#e2e8f0" />
    <rect x="68" y="130" width="76" height="6" rx="3" fill="#cbd5e1" />
    
    <!-- Stamp circle at bottom left -->
    <circle cx="82" cy="158" r="14" stroke="#93c5fd" stroke-width="2.5" stroke-dasharray="3 2" fill="#eff6ff" />
    <circle cx="82" cy="158" r="9" fill="#bfdbfe" fill-opacity="0.5" />
  </g>

  <!-- Floating Official Security Shield -->
  <g transform="translate(132, 126)" filter="url(#dropShadow)">
    <circle cx="36" cy="36" r="32" fill="#ffffff" />
    <circle cx="36" cy="36" r="28" fill="url(#shieldGrad)" />
    <!-- Checkmark inside shield -->
    <path d="M26 36 L33 43 L47 29" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Floating AI Sparkle Badge -->
  <g transform="translate(36, 44)" filter="url(#dropShadow)">
    <rect x="0" y="0" width="34" height="22" rx="7" fill="#7c3aed" />
    <text x="17" y="15" fill="#ffffff" font-size="11" font-weight="900" font-family="system-ui, sans-serif" text-anchor="middle" letter-spacing="0.5">AI</text>
  </g>

  <!-- Small floating sparkle stars -->
  <path d="M190 40 L193 48 L201 51 L193 54 L190 62 L187 54 L179 51 L187 48 Z" fill="#fde047" />
  <path d="M42 165 L44 171 L50 173 L44 175 L42 181 L40 175 L34 173 L40 171 Z" fill="#60a5fa" />
</svg>
