<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%" fill="none">
  <defs>
    <filter id="docShadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0F172A" flood-opacity="0.25"/>
    </filter>
    <linearGradient id="docGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F1F5F9"/>
    </linearGradient>
    <linearGradient id="foldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#CBD5E1"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
  </defs>

  <!-- Document Back / Shadow Group -->
  <g filter="url(#docShadow)">
    <!-- Main Document Body -->
    <path d="M42 34 C42 26 48 20 56 20 L126 20 L158 52 L158 166 C158 174 152 180 144 180 L56 180 C48 180 42 174 42 166 Z" fill="url(#docGrad)"/>
    
    <!-- Top-Right Corner Fold -->
    <path d="M126 20 L126 48 C126 50 128 52 130 52 L158 52 Z" fill="url(#foldGrad)"/>
  </g>

  <!-- Document Header Bar -->
  <rect x="58" y="42" width="56" height="8" rx="4" fill="#2563EB"/>

  <!-- Document Text Lines -->
  <rect x="58" y="60" width="84" height="5" rx="2.5" fill="#94A3B8"/>
  <rect x="58" y="74" width="76" height="5" rx="2.5" fill="#CBD5E1"/>
  <rect x="58" y="88" width="84" height="5" rx="2.5" fill="#CBD5E1"/>
  <rect x="58" y="102" width="60" height="5" rx="2.5" fill="#E2E8F0"/>

  <!-- Official Stamp / Gold Seal -->
  <circle cx="80" cy="142" r="16" fill="url(#goldGrad)" opacity="0.95"/>
  <circle cx="80" cy="142" r="13" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-dasharray="3 2"/>
  <path d="M74 142 L78 146 L87 137" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Floating Security Shield Badge -->
  <g filter="url(#docShadow)">
    <circle cx="140" cy="138" r="24" fill="#FFFFFF"/>
    <circle cx="140" cy="138" r="21" fill="url(#shieldGrad)"/>
    <path d="M132 134 L138 140 L149 129" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Sparkle Accents -->
  <path d="M30 65 L33 55 L43 52 L33 49 L30 39 L27 49 L17 52 L27 55 Z" fill="#FDE047" opacity="0.9"/>
  <circle cx="168" cy="85" r="3.5" fill="#60A5FA"/>
  <circle cx="36" cy="150" r="2.5" fill="#93C5FD"/>
</svg>
